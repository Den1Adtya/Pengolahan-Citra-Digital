<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">ImageLab Live</title>
  <desc id="desc">Pixel image frame with RGB-inspired color blocks.</desc>
  <defs>
    <linearGradient id="bg" x1="5" y1="4" x2="59" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172B4D"/>
      <stop offset=".55" stop-color="#10243B"/>
      <stop offset="1" stop-color="#211B43"/>
    </linearGradient>
    <linearGradient id="frame" x1="12" y1="12" x2="53" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93C5FD"/>
      <stop offset=".55" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="scan" x1="17" y1="0" x2="48" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="4" y="4" width="56" height="56" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="#7DD3FC" stroke-opacity=".28" stroke-width="1.5"/>
  <path d="M14 19.5A5.5 5.5 0 0 1 19.5 14h25A5.5 5.5 0 0 1 50 19.5v25a5.5 5.5 0 0 1-5.5 5.5h-25a5.5 5.5 0 0 1-5.5-5.5v-25Z" fill="#081525" fill-opacity=".56" stroke="url(#frame)" stroke-width="2"/>
  <g filter="url(#glow)">
    <rect x="21" y="21" width="8" height="8" rx="2" fill="#3B82F6"/>
    <rect x="35" y="21" width="8" height="8" rx="2" fill="#06B6D4"/>
    <rect x="21" y="35" width="8" height="8" rx="2" fill="#8B5CF6"/>
    <rect x="35" y="35" width="8" height="8" rx="2" fill="#22C55E"/>
  </g>
  <path d="M17 32h30" stroke="url(#scan)" stroke-width="1.8" stroke-linecap="round" opacity=".9"/>
  <circle cx="48.5" cy="15.5" r="2.5" fill="#67E8F9"/>
</svg>
